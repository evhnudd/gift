{% extends "base.html" %}
{% block title %}{{ user.name }} — Пользователь{% endblock %}
{% block content %}
<h1>{{ user.name }}</h1>
<p><strong>Электронная почта:</strong> {{ user.email }}</p>

{% endblock %}
