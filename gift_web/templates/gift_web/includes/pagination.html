{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Страницы списка">
    <ul class="pagination">
        {% if page_obj.has_previous %}
            <li class="page-item"><a class="page-link" href="{% querystring page=1 %}">« Первая</a></li>
            <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.previous_page_number %}">Назад</a></li>
        {% endif %}
        <li class="page-item active"><span class="page-link">{{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}
            <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.next_page_number %}">Вперёд</a></li>
            <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.paginator.num_pages %}">Последняя »</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
