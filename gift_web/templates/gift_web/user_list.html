{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<h1>Пользователи</h1>
<div class="list-group">
{% for user in users %}
    <a class="list-group-item list-group-item-action" href="{% url 'gift_web:user_detail' user.id %}">{{ user.name }} — {{ user.email }}</a>
{% empty %}<p>Пользователи не найдены.</p>{% endfor %}
</div>
{% endblock %}
