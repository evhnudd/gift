{% extends "base.html" %}
{% block title %}{{ event.title }} — Событие{% endblock %}
{% block content %}
<h1>{{ event.title }}</h1>
<p><strong>Дата:</strong> {{ event.event_date|date:"d.m.Y" }}</p>
<p>{{ event.description|default:"Описание отсутствует." }}</p>
<div class="d-flex gap-2">
    <a class="btn btn-outline-primary" href="{% url 'gift_web:user_detail' event.user_id %}">Пользователь</a>
    <a class="btn btn-outline-primary" href="{% url 'gift_web:gift_detail' event.gift_id %}">Подарок</a>
</div>
{% endblock %}
